{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h1>削除確認</h1>
  <p>「{{ entry.name }}」を削除しますか？</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">削除</button>
    <a class="btn btn-secondary" href="{% url 'entry_list' %}">キャンセル</a>
  </form>
</div>
{% endblock %}
