{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h1>{% if entry %}編集{% elif tsumami_create %}おつまみ登録{% else %}新規作成{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn btn-secondary" href="{% url 'entry_list' %}">キャンセル</a>
  </form>
</div>
{% endblock %}
